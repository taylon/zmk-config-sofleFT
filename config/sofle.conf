# This Sofle has no displays.
CONFIG_ZMK_DISPLAY=n

# This Sofle has normal switches in both encoder positions.
CONFIG_EC11=n

# Per-key RGB - 30 LED per strona (bez underglow)
CONFIG_ZMK_RGB_UNDERGLOW=y

# Keep external power independent of the RGB toggle.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Nazwa klawiatury
CONFIG_ZMK_KEYBOARD_NAME="Sofle FT"

# BT moc
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep
CONFIG_ZMK_SLEEP=y

# Use the compiled keymap, including custom Adv360 behaviors.
CONFIG_ZMK_STUDIO=n

# Eager debouncing (jak w innych klawiaturach FT)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Auto-off RGB - oszczędza baterię (odkomentuj jeśli chcesz)
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
